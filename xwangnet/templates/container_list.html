{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Docker Containers</h1>
        <div class="stats-summary">
            <span class="badge bg-success" id="running-count">-- Running</span>
            <span class="badge bg-secondary" id="total-count">-- Total</span>
        </div>
    </div>

    <div id="deployments-container">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Loading containers...</p>
        </div>
    </div>
</div>

<script>
let updateTimer;

async function fetchContainerData() {
    try {
        const response = await fetch('/api/containers/');
        const data = await response.json();
        
        if (data.status === 'success') {
            updateContainerList(data.data);
        } else {
            throw new Error(data.message);
        }
    } catch (error) {
        console.error('Error fetching container data:', error);
        document.getElementById('deployments-container').innerHTML = `
            <div class="alert alert-danger">
                Error loading containers: ${error.message}
            </div>
        `;
    }
}

function updateContainerList(data) {
    const deploymentsContainer = document.getElementById('deployments-container');
    const runningCount = document.getElementById('running-count');
    const totalCount = document.getElementById('total-count');
    
    // Update counts
    runningCount.textContent = `${data.running_count} Running`;
    totalCount.textContent = `${data.total_count} Total`;
    
    // Generate deployments HTML
    let html = '';
    
    if (Object.keys(data.deployments).length === 0) {
        html = `
            <div class="alert alert-info">
                <h4 class="alert-heading">No containers found</h4>
                <p>There are no active deployments with containers.</p>
            </div>
        `;
    } else {
        for (const [deploymentId, deployment] of Object.entries(data.deployments)) {
            html += `
                <div class="deployment-section mb-5">
                    <h3 class="deployment-title mb-3">
                        ${deployment.name}
                        <span class="badge bg-info">${deployment.containers.length} containers</span>
                        <span class="badge ${deployment.network_status === 'up' ? 'bg-success' : 'bg-danger'}">
                            Network ${deployment.network_status}
                        </span>
                    </h3>
                    <div class="row">
                        ${deployment.containers.map(container => 
                            generateContainerCard(container)
                        ).join('')}
                    </div>
                </div>
            `;
        }
    }
    
    deploymentsContainer.innerHTML = html;
    
    // Initialize all tooltips and other Bootstrap components
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
    var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl)
    });
}

function generateContainerCard(container) {
    const healthClass = container.status === 'running' 
        ? (container.health_status === 'healthy' ? 'bg-success' 
           : container.health_status === 'unhealthy' ? 'bg-warning' 
           : 'bg-success')
        : container.status === 'exited' ? 'bg-danger' : 'bg-secondary';

    return `
        <div class="col-12 col-xl-6 mb-4">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center ${healthClass} text-white">
                    <h5 class="mb-0">${container.name}</h5>
                    <div>
                        ${container.status === 'running' && container.health_status !== 'No health check' 
                            ? `<span class="badge status-badge me-2">
                                <i class="fas fa-heartbeat"></i> ${container.health_status}
                               </span>`
                            : ''}
                        <span class="badge status-badge">${container.status}</span>
                    </div>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Image:</strong> ${container.image}</p>
                            <p><strong>ID:</strong> ${container.id}</p>
                            <p><strong>Network:</strong> ${container.network || 'None'}</p>
                            <p><strong>Isolated:</strong> ${container.is_isolated === true ? "True" : container.is_isolated === false ? "False" : "None"}</p>
                            <p><strong>Created:</strong> ${new Date(container.created).toLocaleString()}</p>
                        </div>
                        <div class="col-md-6">
                            ${container.status === 'running' ? generateResourceUsage(container) : ''}
                        </div>
                    </div>

                    ${container.health_log ? generateHealthCheck(container) : ''}
                    ${container.ports ? generatePortMappings(container) : ''}
                </div>
            </div>
        </div>
    `;
}

function generateResourceUsage(container) {
    return `
        <div class="resource-usage">
            <h6>Resource Usage:</h6>
            <div class="resource-item mb-3">
                <div class="d-flex justify-content-between mb-1">
                    <span><i class="fas fa-microchip"></i> CPU Usage</span>
                    <span>${container.cpu_usage}%</span>
                </div>
                <div class="progress">
                    <div class="progress-bar bg-primary" role="progressbar" 
                         style="width: ${container.cpu_usage}%"
                         aria-valuenow="${container.cpu_usage}" 
                         aria-valuemin="0" aria-valuemax="100">
                    </div>
                </div>
            </div>
            <div class="resource-item">
                <div class="d-flex justify-content-between mb-1">
                    <span><i class="fas fa-memory"></i> RAM Usage</span>
                    <span>${container.mem_percent}%</span>
                </div>
                <div class="progress">
                    <div class="progress-bar bg-info" role="progressbar" 
                         style="width: ${container.mem_percent}%"
                         aria-valuenow="${container.mem_percent}" 
                         aria-valuemin="0" aria-valuemax="100">
                    </div>
                </div>
                <small class="text-muted">
                    ${container.mem_usage}MB / ${container.mem_limit}MB
                </small>
            </div>
        </div>
    `;
}

function generateHealthCheck(container) {
    return `
        <div class="mt-3">
            <div class="health-check-header" data-bs-toggle="collapse" 
                 href="#healthCheck${container.id}" role="button" 
                 aria-expanded="false" aria-controls="healthCheck${container.id}">
                <h6 class="mb-0">
                    <i class="fas fa-heartbeat me-2"></i>
                    Health Check History
                    <i class="fas fa-chevron-down float-end"></i>
                </h6>
            </div>
            <div class="collapse" id="healthCheck${container.id}">
                <div class="health-check-content">
                    ${Array.isArray(container.health_log) ? container.health_log.map(check => `
                        <div class="health-check-item ${check.ExitCode === 0 ? 'text-success' : 'text-danger'}">
                            <div class="d-flex justify-content-between align-items-center">
                                <span>
                                    <i class="fas fa-${check.ExitCode === 0 ? 'check' : 'times'}-circle"></i>
                                    ${new Date(check.Start).toLocaleString()}
                                </span>
                                <span class="badge ${check.ExitCode === 0 ? 'bg-success' : 'bg-danger'}">
                                    Exit Code: ${check.ExitCode}
                                </span>
                            </div>
                            <div class="health-check-output">
                                ${check.Output}
                            </div>
                        </div>
                    `).join('') : '<div class="health-check-item">No health logs</div>'}
                </div>
            </div>
        </div>
    `;
}

function generatePortMappings(container) {
    return `
        <div class="mt-3">
            <div class="port-mappings-header" data-bs-toggle="collapse" 
                 href="#portMappings${container.id}" role="button" 
                 aria-expanded="false" aria-controls="portMappings${container.id}">
                <h6 class="mb-0">
                    <i class="fas fa-network-wired me-2"></i>
                    Port Mappings 
                    <span class="badge bg-secondary ms-2">${Object.keys(container.ports).length}</span>
                    <i class="fas fa-chevron-down float-end"></i>
                </h6>
            </div>
            <div class="collapse" id="portMappings${container.id}">
                <div class="port-mappings-content">
                    ${Object.entries(container.ports).map(([host, container_ports]) => {
                        let containerPortStr = container_ports
                            ? container_ports.map(port => `${port.HostIp}:${port.HostPort}`).join(', ')
                            : 'N/A'; // Handle `null` case

                        return `
                            <div class="port-mapping-item">
                                <i class="fas fa-random me-2"></i>
                                <span class="host-port">${host}</span>
                                <i class="fas fa-arrow-right mx-2"></i>
                                <span class="container-port">${containerPortStr}</span>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        </div>
    `;
}

// Initial load
fetchContainerData();

// Setup periodic refresh
updateTimer = setInterval(fetchContainerData, 30000);

// Cleanup on page unload
window.addEventListener('unload', () => {
    if (updateTimer) {
        clearInterval(updateTimer);
    }
});
</script>

<style>
.deployment-title {
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 0.5rem;
}

.deployment-section {
    background-color: var(--secondary-bg);
    padding: 20px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    transition: background-color 0.3s ease, border-color 0.3s ease;
}

.stats-summary .badge {
    font-size: 1rem;
    margin-left: 10px;
}

.deployment-title .badge {
    margin-left: 10px;
}

/* Dark mode adjustments for health check and port mapping sections */
[data-bs-theme="dark"] .health-check-header,
[data-bs-theme="dark"] .port-mappings-header,

[data-bs-theme="dark"] .health-check-output {
    background-color: var(--secondary-bg);
}

[data-bs-theme="dark"] .health-check-content,
[data-bs-theme="dark"] .port-mappings-content {
    background-color: var(--primary-bg);
    border-color: var(--border-color);
}

[data-bs-theme="dark"] .health-check-item,
[data-bs-theme="dark"] .port-mapping-item {
    border-color: var(--border-color);
}

[data-bs-theme="dark"] .progress {
    background-color: var(--border-color);
}
</style>
{% endblock %}
