<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker Compose Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f9;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background: #fff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }
    h1, h2 {
      text-align: center;
      color: #4CAF50;
    }
    form {
      margin: 20px 0;
    }
    label {
      font-weight: bold;
      display: block;
      margin: 10px 0 5px;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }
    button {
      background: #4CAF50;
      color: white;
      cursor: pointer;
      border: none;
    }
    button:hover {
      background: #45a049;
    }
    .output {
      margin-top: 20px;
      padding: 10px;
      background: #eef;
      border: 1px solid #ccd;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Docker Compose Generator</h1>
    <h2>Add a Service</h2>
    <form id="service-form">
      <label for="service-name">Service Name</label>
      <input type="text" id="service-name" placeholder="e.g., web" required>
      <label for="service-image">Image</label>
      <input type="text" id="service-image" placeholder="e.g., nginx:latest" required>
      <label for="service-ports">Ports (comma-separated)</label>
      <input type="text" id="service-ports" placeholder="e.g., 8080:80, 443:443">
      <label for="service-environment">Environment Variables (key=value, comma-separated)</label>
      <input type="text" id="service-environment" placeholder="e.g., NODE_ENV=production">
      <label for="service-networks">Networks (comma-separated)</label>
      <input type="text" id="service-networks" placeholder="e.g., frontend, backend">
      <label for="service-volumes">Volumes (comma-separated)</label>
      <input type="text" id="service-volumes" placeholder="e.g., ./host:/container">
      <button type="button" onclick="addService()">Add Service</button>
    </form>

    <h2>Add a Network</h2>
    <form id="network-form">
      <label for="network-name">Network Name</label>
      <input type="text" id="network-name" placeholder="e.g., frontend" required>
      <label for="network-driver">Driver</label>
      <input type="text" id="network-driver" placeholder="e.g., bridge" value="bridge">
      <button type="button" onclick="addNetwork()">Add Network</button>
    </form>

    <h2>Add a Volume</h2>
    <form id="volume-form">
      <label for="volume-name">Volume Name</label>
      <input type="text" id="volume-name" placeholder="e.g., data-volume" required>
      <label for="volume-driver">Driver</label>
      <input type="text" id="volume-driver" placeholder="e.g., local" value="local">
      <button type="button" onclick="addVolume()">Add Volume</button>
    </form>

    <button onclick="generateCompose()">Generate docker-compose.yml</button>

    <div class="output" id="output" style="display: none;">
      <h2>Generated docker-compose.yml</h2>
      <pre id="compose-output"></pre>
      <button onclick="downloadCompose()">Download</button>
    </div>
  </div>

  <script>
    const composeData = {
      version: "3.9",
      services: {},
      networks: {},
      volumes: {}
    };

    function addService() {
      const name = document.getElementById("service-name").value;
      const image = document.getElementById("service-image").value;
      const ports = document.getElementById("service-ports").value.split(",").map(p => p.trim()).filter(p => p);
      const environment = Object.fromEntries(
        document.getElementById("service-environment").value.split(",").map(kv => kv.split("=").map(v => v.trim())).filter(kv => kv.length === 2)
      );
      const networks = document.getElementById("service-networks").value.split(",").map(n => n.trim()).filter(n => n);
      const volumes = document.getElementById("service-volumes").value.split(",").map(v => v.trim()).filter(v => v);

      composeData.services[name] = { image };
      if (ports.length) composeData.services[name].ports = ports;
      if (Object.keys(environment).length) composeData.services[name].environment = environment;
      if (networks.length) composeData.services[name].networks = networks;
      if (volumes.length) composeData.services[name].volumes = volumes;

      alert(`Service '${name}' added!`);
      document.getElementById("service-form").reset();
    }

    function addNetwork() {
      const name = document.getElementById("network-name").value;
      const driver = document.getElementById("network-driver").value;
      composeData.networks[name] = { driver };
      alert(`Network '${name}' added!`);
      document.getElementById("network-form").reset();
    }

    function addVolume() {
      const name = document.getElementById("volume-name").value;
      const driver = document.getElementById("volume-driver").value;
      composeData.volumes[name] = { driver };
      alert(`Volume '${name}' added!`);
      document.getElementById("volume-form").reset();
    }

    function generateCompose() {
      const yaml = jsyaml.dump(composeData, { noRefs: true });
      document.getElementById("compose-output").innerText = yaml;
      document.getElementById("output").style.display = "block";
    }

    function downloadCompose() {
      const yaml = jsyaml.dump(composeData, { noRefs: true });
      const blob = new Blob([yaml], { type: "text/yaml" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "docker-compose.yml";
      link.click();
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml/dist/js-yaml.min.js"></script>
</body>
</html>
